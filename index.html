<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neue Website in Minuten</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="logo">WebStart</span>
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
    </div>
  </header>

  <main class="hero">
    <div class="container hero-inner">

      <div class="badge" data-de="Fur Handwerker" data-en="For Tradespeople">Fur Handwerker</div>

      <h1 class="headline" data-de="Aus deiner alten Website&nbsp;wird in&nbsp;Minuten eine neue." data-en="Turn your old website into&nbsp;a new one&nbsp;in minutes.">
        Aus deiner alten Website&nbsp;wird in&nbsp;Minuten eine neue.
      </h1>

      <p class="subline" data-de="Einfach die URL deiner bisherigen Website eingeben. Wir erstellen automatisch eine moderne, professionelle neue Seite fur dein Handwerk." data-en="Just enter the URL of your current website. We automatically create a modern, professional new site for your trade.">
        Einfach die URL deiner bisherigen Website eingeben. Wir erstellen automatisch eine moderne, professionelle neue Seite fur dein Handwerk.
      </p>

      <form class="input-form" id="mainForm" novalidate>
        <div class="input-row">
          <div class="input-wrap" id="inputWrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </span>
            <input
              type="url"
              id="urlInput"
              class="url-input"
              placeholder="z.B. https://www.schmidt-heizung.de"
              autocomplete="url"
              spellcheck="false"
              data-placeholder-de="z.B. https://www.schmidt-heizung.de"
              data-placeholder-en="e.g. https://www.schmidt-heizung.de"
            />
          </div>
          <button type="submit" class="cta-btn" id="ctaBtn">
            <span class="btn-label" data-de="Website starten" data-en="Start website">Website starten</span>
          </button>
        </div>
        <p class="error-msg" id="errorMsg" role="alert" aria-live="polite"></p>
      </form>

      <button class="alt-link" id="altLink" type="button" data-de="Keine Website? Kurzbeschreibung eingeben" data-en="No website? Enter a short description">
        Keine Website? Kurzbeschreibung eingeben
      </button>

      <div class="loading-state" id="loadingState" aria-live="polite" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text" data-de="Website wird analysiert&#8230;" data-en="Analysing your website&#8230;">Website wird analysiert&#8230;</p>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-de="Gemacht fur das deutsche Handwerk." data-en="Made for German trades.">Gemacht fur das deutsche Handwerk.</span>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
